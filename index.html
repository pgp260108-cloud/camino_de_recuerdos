<style>
/* Layout: una columna; cabecera a la izquierda, lienzo del juego a todo el ancho, cruceta táctil debajo. */
:root{
  --bg:#141c16;
  --panel:#1d2820;
  --line:#2e4133;
  --fg:#e7eedd;
  --muted:#9bae9f;
  --accent:#f0b34a;
  --display:'Pixelify Sans','Courier New',monospace;
  --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
body{
  background:var(--bg);
  color:var(--fg);
  font:15px/1.5 var(--body);
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font:700 28px/1.1 var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.frame{position:relative;border:3px solid var(--line);background:#0e1410}
.frame:focus-within{border-color:var(--accent)}
canvas{
  display:block;width:100%;height:auto;aspect-ratio:320/224;
  image-rendering:crisp-edges;image-rendering:pixelated;outline:none;
}
.hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  max-width:calc(100% - 24px);text-align:center;
  background:rgba(20,28,22,.9);color:var(--fg);border:2px solid var(--line);
  padding:6px 12px;font:500 13px/1.35 var(--body);pointer-events:none;
}
.keys{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.keys span{display:inline-flex;gap:4px;align-items:center}
kbd{
  display:inline-block;min-width:26px;padding:2px 6px;text-align:center;
  font:500 12px/1.4 var(--body);color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:2px;
}
.pad{
  display:none;justify-content:center;gap:6px;
  grid-template-columns:repeat(3,56px);
  grid-template-areas:". up ." "left down right";
  touch-action:none;
}
.pad button{
  width:56px;height:56px;padding:0;font:500 18px/1 var(--body);color:var(--fg);
  background:var(--panel);border:2px solid var(--line);border-radius:4px;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
.pad button.on{background:var(--accent);border-color:var(--accent);color:#1a1405}
.pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pad [data-k="up"]{grid-area:up}
.pad [data-k="left"]{grid-area:left}
.pad [data-k="down"]{grid-area:down}
.pad [data-k="right"]{grid-area:right}
.read{
  position:absolute;transform:translateX(-50%);z-index:2;
  min-height:44px;padding:8px 20px;font:700 17px/1 var(--display);letter-spacing:.02em;
  color:#1a1405;background:var(--accent);border:3px solid #14261a;border-radius:2px;
  box-shadow:0 3px 0 rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;
}
.read:hover{background:#f7c466}
.read:active{transform:translateX(-50%) translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.read:focus-visible,.note .close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
dialog.note{
  width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;box-sizing:border-box;
  margin:auto;padding:16px;color:var(--fg);background:var(--panel);
  border:3px solid var(--line);border-radius:0;box-shadow:0 0 0 4px rgba(0,0,0,.35);
}
dialog.note::backdrop{background:rgba(8,14,10,.72)}
.note img{display:block;width:100%;height:auto;max-height:50dvh;object-fit:contain;margin:0 0 14px;border:2px solid var(--line);background:#0e1410}
.note p{margin:0 0 16px;font-size:16px;line-height:1.55;text-wrap:pretty}
.note .close{
  display:block;min-height:44px;margin-left:auto;padding:8px 20px;font:700 16px/1 var(--display);
  color:#1a1405;background:var(--accent);border:3px solid #14261a;border-radius:2px;
  box-shadow:0 3px 0 rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;

}

/* Pantalla completa: solo el juego, sin márgenes ni cabecera */
:root{padding:0 !important}
html,body{height:100%;margin:0;padding:0 !important;overflow:hidden;background:#000;overscroll-behavior:none}
.wrap{max-width:none;margin:0;gap:0;height:100%}
.frame{position:fixed;inset:0;border:0;background:#000}
.frame:focus-within{border-color:transparent}
canvas{width:100%;height:100%;aspect-ratio:auto}
.hint{bottom:max(12px,env(safe-area-inset-bottom,0px))}
.stick{
  display:none;position:absolute;z-index:3;

}

  pointer-events:none;will-change:transform;

@media (pointer:coarse){ .stick{display:block} }
.fin{position:fixed;inset:0;z-index:50;background:#bfe6fb;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16vh 32px 32px;box-sizing:border-box;transition:opacity 1s linear}
.fin.on{opacity:1;pointer-events:auto}
.fin p{margin:0;max-width:640px;text-align:center;color:#000;font:500 clamp(20px,3.4vw,30px)/1.6 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;text-wrap:balance;opacity:0;transition:opacity 1.2s ease}
.fin.txt p{opacity:1}

/* Móviles: texto final más pequeño (y con scroll por si no cabe) */
@media (pointer:coarse) and (max-width:820px), (pointer:coarse) and (max-height:520px){
  .fin{padding:8vh 24px 16px;overflow-y:auto}
  .fin p{font-size:clamp(13px,3.6vmin,16px);line-height:1.5}
  .fin p:first-child{margin-bottom:clamp(20px,8vh,48px)}
  .fin p.sub2{font-size:clamp(12px,3vmin,14px);line-height:1.5}
}

/* Móviles: obligar a jugar en horizontal */
.rotate{display:none;position:fixed;inset:0;z-index:2000;background:#141c16;color:#e7eedd;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;
  font:700 20px/1.3 'Pixelify Sans','Courier New',monospace}
.rotate svg{width:84px;height:84px;animation:giro 2.4s ease-in-out infinite}

  .rotate{display:flex}
  dialog.note,dialog.note::backdrop{display:none}
}
@media (prefers-reduced-motion:reduce){.rotate svg{animation:none;transform:rotate(-90deg)}}
</style>

<script>
/* Intenta bloquear la orientación en horizontal (solo funciona en algunos navegadores, normalmente en pantalla completa) */
(()=>{
  const mobile=matchMedia('(pointer:coarse) and (max-width:820px), (pointer:coarse) and (max-height:820px)');
  function lock(){
    if(!mobile.matches||!screen.orientation||!screen.orientation.lock)return;
    screen.orientation.lock('landscape').catch(()=>{});
  }
  addEventListener('pointerdown',lock,{once:true});
})();

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const T = 16, W = 48 * T, H = 34 * T;      // mapa: 48 x 34 casillas de 16 px
let VW = 320, VH = 224;                    // vista interna del juego (se adapta a la pantalla)
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fitView(){
  const aspect = Math.max(0.3, Math.min(3, window.innerWidth / Math.max(1, window.innerHeight)));
  let vh = Math.sqrt(71680 / aspect), vw = vh * aspect;     // ~ mismo área visible que antes
  vw = Math.min(W, Math.round(vw)); vh = Math.min(H, Math.round(vw / aspect));
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  ctx.imageSmoothingEnabled = false;
}
fitView();
window.addEventListener('resize', fitView);
const hint = document.getElementById('hint');
const readBtn = document.getElementById('read');
const dlg = document.getElementById('note');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Utilidades ---------- */
// Solo se usa para dibujar la textura de las copas de los robles (arte del sprite, no el mapa).
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hash(x, y){
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + 1013904223 | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = s(xf), v = s(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mk(w, h, fn){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  if (fn) fn(g, c);
  return c;
}
function R(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(x, y, w, h); }
function ell(g, cx, cy, rx, ry, c){
  g.fillStyle = c;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++){
    const dy = (y + 0.5 - cy) / ry;
    if (dy < -1 || dy > 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy);
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
  }
}
function outline(src, col){
  const w = src.width + 2, h = src.height + 2;
  const out = mk(w, h, g => g.drawImage(src, 1, 1));
  const g = out.getContext('2d');
  const id = g.getImageData(0, 0, w, h), d = id.data;
  const solid = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) solid[i] = d[i * 4 + 3] > 40 ? 1 : 0;
  const [r, gg, b] = hexRGB(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y * w + x;
    if (solid[i]) continue;
    if ((x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])){
      d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
    }
  }
  g.putImageData(id, 0, 0);
  return out;
}
const flip = s => ({
  c: mk(s.c.width, s.c.height, g => { g.translate(s.c.width, 0); g.scale(-1, 1); g.drawImage(s.c, 0, 0); }),
  ax: s.c.width - s.ax, ay: s.ay
});
const withFlip = arr => arr.flatMap(s => [s, flip(s)]);

/* ---------- Geometría del mapa: estanque y camino ---------- */
const POND = [
  { x: 610, y: 150, rx: 58, ry: 36 },
  { x: 585, y: 157, rx: 38, ry: 30 },
  { x: 640, y: 142, rx: 36, ry: 27 }
];
function inEll(x, y, p, s = 1){
  const a = (x - p.x) / (p.rx * s), b = (y - p.y) / (p.ry * s);
  return a * a + b * b < 1;
}
// Camino: empieza en la esquina superior izquierda (donde aparece el personaje) y serpentea
// por todo el mapa en tres tramos (arriba -> derecha, medio -> izquierda, abajo -> derecha)
// hasta terminar en la esquina inferior derecha.
const CTRL = [[58,76],[112,86],[180,98],[250,92],[320,80],[390,88],[460,100],[530,90],[600,80],[660,84],[696,102],[710,150],[712,205],[694,252],[656,284],[600,296],[540,286],[480,270],[410,282],[340,300],[270,296],[200,280],[130,286],[84,306],[66,350],[64,402],[84,442],[130,462],[190,458],[260,448],[330,458],[400,472],[470,468],[540,454],[610,452],[664,462],[704,468],[748,475],[772,479]];
function catmull(p0, p1, p2, p3, t){
  const t2 = t * t, t3 = t2 * t;
  return [0, 1].map(i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t3));
}
const PATH = [];
for (let i = 0; i < CTRL.length - 1; i++){
  const p0 = CTRL[Math.max(0, i - 1)], p1 = CTRL[i], p2 = CTRL[i + 1], p3 = CTRL[Math.min(CTRL.length - 1, i + 2)];
  const n = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 2);
  for (let k = 0; k < n; k++) PATH.push(catmull(p0, p1, p2, p3, k / n));
}
const SPAWN = CTRL[0].slice();   // esquina superior izquierda

/* ---------- Datos fijos del mapa (colocados una vez; no se generan al cargar) ---------- */
// Flores: [x, y, color] con color = índice de FCOL (0 blanco, 1 rosa, 2 amarillo, 3 azul, 4 violeta)
const FLOWERS = [
  [475,440,4],[491,440,3],[485,435,4],[496,431,3],[493,436,4],[636,368,2],[639,375,0],[624,376,2],
  [160,168,4],[147,161,4],[149,160,4],[164,172,4],[145,165,4],[146,169,4],[499,159,4],[498,153,2],
  [501,165,4],[497,165,2],[511,163,4],[505,158,2],[521,363,0],[511,365,4],[520,354,0],[619,325,1],
  [619,318,3],[619,322,1],[619,331,3],[607,322,1],[607,318,3],[624,322,1],[368,124,2],[356,132,0],
  [369,130,2],[111,328,1],[115,328,1],[112,323,1],[104,325,1],[419,394,3],[401,400,3],[399,397,3],
  [418,403,3],[381,106,2],[383,117,0],[380,119,2],[385,109,0],[380,109,2],[390,113,0],[202,140,3],
  [209,133,1],[220,134,3],[217,133,1],[217,139,3],[205,134,1],[224,139,3],[593,496,2],[600,489,3],
  [600,491,2],[589,485,3],[596,493,2],[583,487,3],[123,321,3],[123,320,0],[122,325,3],[109,325,0],
  [118,331,3],[122,330,0],[111,334,3],[687,198,4],[696,193,0],[692,196,4],[678,203,0],[376,260,3],
  [382,260,3],[370,259,3],[383,267,3],[371,267,3],[381,262,3],[356,194,1],[363,202,2],[360,199,1],
  [165,317,3],[177,313,3],[155,324,3],[157,314,3],[179,319,3],[174,318,3],[249,250,0],[262,259,1],
  [246,263,0],[243,259,1],[250,251,0]
];
// Setas: [x, y]
const SHROOMS = [
  [547,196],[141,345],[254,207],[214,241],[111,193],[186,324],[388,360],[190,233]
];
// Destellos del agua: [x, y, fase]
const SPARK = [
  [667,138,5.36],[653,154,5.05],[597,162,4.3],[565,153,1.94],[648,161,6.07],[646,139,4.38],[564,174,6.12],[626,129,6.26],
  [651,128,3.29],[585,159,2.91],[626,135,1.63],[626,175,4.45],[577,135,3.33],[639,145,0.91]
].map(([x, y, ph]) => ({ x, y, ph }));

/* ---------- Suelo (se dibuja una sola vez) ---------- */
const world = mk(W, H, g => {
  // Césped moteado
  const GR = ['#4c9a41', '#55a446', '#5fae4d', '#69b856', '#75c161'];
  for (let cy = 0; cy < H / 4; cy++) for (let cx = 0; cx < W / 4; cx++){
    const n = vnoise(cx / 7, cy / 7) * 0.65 + vnoise(cx / 2.5 + 40, cy / 2.5 + 17) * 0.35;
    R(g, cx * 4, cy * 4, 4, 4, GR[clamp(Math.floor(n * 5), 0, 4)]);
  }
  // Briznas y motas: patrón fijo calculado a partir de la posición (sin azar)
  for (let cy = 0; cy < H / 8; cy++) for (let cx = 0; cx < W / 8; cx++){
    if (hash(cx, cy + 1000) < 0.14){
      const x = cx * 8 + 1 + Math.floor(hash(cx, cy + 2000) * 6), y = cy * 8 + 2 + Math.floor(hash(cx, cy + 3000) * 5);
      const c = hash(cx, cy + 4000) < 0.5 ? '#8ed46e' : '#3f8638';
      R(g, x, y, 1, 3, c); R(g, x - 1, y + 1, 1, 2, c); R(g, x + 1, y + 1, 1, 2, c);
    }
    if (hash(cx + 500, cy) < 0.09){
      R(g, cx * 8 + Math.floor(hash(cx + 600, cy) * 6), cy * 8 + Math.floor(hash(cx + 700, cy) * 7), 2, 1, hash(cx + 800, cy) < 0.5 ? '#4a9440' : '#83cc66');
    }
  }
  // Sombra del bosque en los bordes
  g.fillStyle = 'rgba(8,36,18,0.16)';
  [[0, 0, W, 56], [0, H - 56, W, 56], [0, 0, 56, H], [W - 56, 0, 56, H]].forEach(a => g.fillRect(a[0], a[1], a[2], a[3]));
  g.fillStyle = 'rgba(8,36,18,0.14)';
  [[0, 0, W, 30], [0, H - 30, W, 30], [0, 0, 30, H], [W - 30, 0, 30, H]].forEach(a => g.fillRect(a[0], a[1], a[2], a[3]));

  // Estanque
  const grow = (p, d) => [p.x, p.y, p.rx + d, p.ry + d];
  POND.forEach(p => ell(g, ...grow(p, 6), '#cdb87f'));
  POND.forEach(p => ell(g, ...grow(p, 4), '#e2d29f'));
  POND.forEach(p => ell(g, ...grow(p, 0), '#5cb6d9'));
  POND.forEach(p => ell(g, ...grow(p, -5), '#4aa3cd'));
  POND.forEach(p => ell(g, ...grow(p, -12), '#3a8bbb'));
  // Nenúfares
  ell(g, 600, 150, 4, 2, '#3f9a4a'); R(g, 601, 148, 2, 2, '#f4a3c0');
  ell(g, 628, 158, 4, 2, '#3f9a4a'); ell(g, 575, 142, 3, 2, '#4aa955');

(function placeBag(){
  for (let i = 0; i < 400; i++){
    const x = 40 + Math.random() * (W - 80), y = 60 + Math.random() * (H - 90);
    if (!bagBlocked(x, y) && Math.hypot(x - player.x, y - player.y) > 90){ bag.x = x; bag.y = y; return; }
  }
  bag.x = player.x + 120; bag.y = player.y;
})();
function bagBlocked(x, y){
  if (x < 28 || x > W - 28 || y < 52 || y > H - 16) return true;
  if (Math.hypot(x - player.x, y - player.y) < 16) return true;   // no se choca con el jugador
  return blocked(x, y) || blocked(x - 3, y) || blocked(x + 3, y);
}
function bagPick(){
  for (let i = 0; i < 10; i++){
    const a = Math.random() * 6.283;
    // mira un poco por delante para no ir directo a un obstáculo
    if (!bagBlocked(bag.x + Math.cos(a) * 14, bag.y + Math.sin(a) * 14)){
      bag.ang = a; bag.walk = 1.2 + Math.random() * 2.6; return;
    }
  }
  bag.walk = 0; bag.pause = 0.4;
}
function updateBag(dt){
  if (bag.pause > 0){
    bag.pause -= dt;
    if (bag.pause <= 0) bagPick();
    return;
  }
  bag.walk -= dt;
  bag.phase += dt;
  const step = 26 * dt;
  const nx = bag.x + Math.cos(bag.ang) * step, ny = bag.y + Math.sin(bag.ang) * step;
  if (!bagBlocked(nx, ny)){ bag.x = nx; bag.y = ny; }
  else { bag.walk = 0; bag.pause = 0.15 + Math.random() * 0.4; return; }
  if (bag.walk <= 0){ bag.pause = 0.5 + Math.random() * 1.6; bag.phase = 0; }
}

const stick = document.getElementById('stick'), knob = document.getElementById('knob');

function resetStick(){
  stickId = null; knob.style.transform = '';

function moveStick(e){
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let x = e.clientX - (r.left + R), y = e.clientY - (r.top + R);
  const d = Math.hypot(x, y), max = R - 14;
  if (d > max){ x *= max / d; y *= max / d; }
  knob.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  const t = max * 0.38;
  keys.left = x < -t; keys.right = x > t; keys.up = y < -t; keys.down = y > t;
}
stick.addEventListener('pointerdown', e => {
  if (dlg.open || stickId !== null) return;
  e.preventDefault(); stickId = e.pointerId; dismissHint();
  try { stick.setPointerCapture(e.pointerId); } catch (_) {}
  moveStick(e);
});

/* ---------- Movimiento y colisiones ---------- */
function blocked(x, y){
  const x0 = x - 4, x1 = x + 4, y0 = y - 5, y1 = y;
  for (const s of solids) if (x1 > s[0] && x0 < s[2] && y1 > s[1] && y0 < s[3]) return true;
  for (const p of POND){
    if (inEll(x0, y0, p) || inEll(x1, y0, p) || inEll(x0, y1, p) || inEll(x1, y1, p)) return true;
  }
  return false;
}
const finEl = document.getElementById('fin');

function triggerEnd(){
  ended = true; clearKeys(); dismissHint();
  finEl.classList.add('on');
  setTimeout(() => finEl.classList.add('txt'), 1000);
}
function update(dt){
  if (ended) return;
  let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  player.moving = !!(dx || dy);
  if (player.moving){
    if (dx && !dy) player.dir = dx > 0 ? 'right' : 'left';
    else if (dy && !dx) player.dir = dy > 0 ? 'down' : 'up';
    else if (player.dir === 'left' || player.dir === 'right') player.dir = dx > 0 ? 'right' : 'left';
    else player.dir = dy > 0 ? 'down' : 'up';
    if (dx && dy){ dx *= 0.7071; dy *= 0.7071; }
    const nx = player.x + dx * SPEED * dt;
    if (!blocked(nx, player.y)) player.x = nx;
    const ny = player.y + dy * SPEED * dt;
    if (!blocked(player.x, ny)) player.y = ny;
    player.x = clamp(player.x, 24, Math.abs(player.y - 479) < 24 ? W - 6 : W - 24);
    if (player.x > W - 14) triggerEnd();
    player.y = clamp(player.y, 48, H - 14);
    player.anim += dt;
  } else {
    player.anim = 0;
  }
  updateBag(dt);
  updateCat(dt);
  if (!reduceMotion) updateBF(dt);
}

      R(ctx, x - 2, y - 1, 2, 2, b.c); R(ctx, x + 1, y - 1, 2, 2, b.c);
    } else {
      R(ctx, x - 1, y - 1, 1, 2, b.c); R(ctx, x + 1, y - 1, 1, 2, b.c);
    }
    R(ctx, x, y, 1, 2, '#3a2a1e');
  }
  drawGlow(t);
}


/* ---------- Luz azul al final del camino ---------- */
// Crece en intensidad y anchura a medida que el camino se acerca al límite derecho del mapa.
const GX0 = 520, GY0 = 400, GW = W - GX0, GH = 144, GEND = [W, 479];
const glowImg = mk(GW, GH, g => {
  const id = g.createImageData(GW, GH), d = id.data;
  const line = PATH.filter(p => p[0] > GX0 - 30).concat([[W - 6, 479], [W, 479]]);
  const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const LV = 7;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++){
    const wx = x + GX0, wy = y + GY0;
    let dm = 1e9;
    for (const p of line){ const dd = (p[0] - wx) * (p[0] - wx) + (p[1] - wy) * (p[1] - wy); if (dd < dm) dm = dd; }
    dm = Math.sqrt(dm);
    const k = clamp((wx - GX0) / (W - GX0), 0, 1), I = Math.pow(k, 1.7);   // 0 lejos -> 1 en el borde
    const rad = 10 + 46 * I;
    let v = Math.pow(clamp(1 - dm / rad, 0, 1), 1.4) * (0.12 + 0.88 * I);
    const bd = Math.hypot((wx - GEND[0]) * 0.8, wy - GEND[1]);                 // resplandor en el propio borde
    v = Math.max(v, Math.pow(clamp(1 - bd / 78, 0, 1), 1.6));
    if (v <= 0.02) continue;
    const q = clamp(Math.floor(v * LV + B4[(y & 3) * 4 + (x & 3)] / 16), 0, LV) / LV;
    if (q <= 0) continue;
    const i = (y * GW + x) * 4, m = Math.pow(q, 1.3);
    d[i] = Math.round(10 + 60 * m); d[i + 1] = Math.round(70 + 110 * m); d[i + 2] = 255; d[i + 3] = Math.round(225 * q);
  }
  g.putImageData(id, 0, 0);
});
const MOTES = Array.from({ length: 14 }, (_, i) => ({ x: 640 + hash(i, 91) * 126, y: 440 + hash(i, 92) * 80, ph: hash(i, 93) * 6.283, sp: 4 + hash(i, 94) * 6 }));
function drawGlow(t){
  const gx = GX0 - cam.x, gy = GY0 - cam.y;
  if (gx > VW || gx + GW < 0 || gy > VH || gy + GH < 0) return;
  const pulse = reduceMotion ? 1 : 0.88 + 0.12 * Math.sin(t * 2.1);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.92 * pulse;
  ctx.drawImage(glowImg, gx, gy);
  ctx.globalAlpha = 1;
  for (const m of MOTES){
    const f = reduceMotion ? 0.5 : ((t * m.sp * 0.05 + m.ph) % 1);
    const px = Math.round(m.x - cam.x + (reduceMotion ? 0 : Math.sin(t + m.ph) * 3)), py = Math.round(m.y - f * 34 - cam.y);
    const k = clamp((m.x - GX0) / (W - GX0), 0, 1), a = Math.sin(f * Math.PI) * k;
    if (a > 0.05) R(ctx, px, py, 1, 1, 'rgba(120,200,255,' + a.toFixed(2) + ')');
  }
  ctx.restore();
}

/* ---------- Cartel: botón "Leer" y menú ---------- */
const NEAR = 46;
const noteText = document.getElementById('note-text');
const notePhoto = document.getElementById('note-photo');
function nearestSign(){
  let best = null, bd = NEAR;
  for (const s of SIGN_POS){
    const d = Math.hypot(player.x - s.x, player.y - s.y);
    if (d < bd){ bd = d; best = s; }
  }
  return best;
}
function updateRead(){
  const s = dlg.open ? null : nearestSign();
  const near = !!s;
  if (readBtn.hidden === near) readBtn.hidden = !near;
  if (near){
    readBtn.style.left = clamp((s.x - cam.x) / VW * 100, 14, 86) + '%';
    readBtn.style.top = clamp((s.y + 6 - cam.y) / VH * 100, 4, 78) + '%';
  }
}
function openNote(s){
  clearKeys();
  dismissHint();
  noteText.textContent = s.note.text;
  const ph = s.note.photo && window.NOTE_PHOTOS ? window.NOTE_PHOTOS[s.note.photo] : null;
  if (ph){ notePhoto.src = ph.src; notePhoto.alt = ph.alt; }
  notePhoto.hidden = !ph;
  dlg.showModal();
  dlg.scrollTop = 0;                               // el texto siempre empieza desde arriba
  requestAnimationFrame(() => { dlg.scrollTop = 0; });
}
readBtn.addEventListener('click', () => { const s = nearestSign(); if (s) openNote(s); });
document.getElementById('note-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => {
  const r = dlg.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
});
dlg.addEventListener('close', () => { clearKeys(); try { canvas.focus({ preventScroll: true }); } catch (_) {} });

/* ---------- Bucle ---------- */
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  draw(ts / 1000);
  updateRead();
  requestAnimationFrame(loop);
}
function start(){ requestAnimationFrame(loop); }
start();
try { canvas.focus({ preventScroll: true }); } catch (_) {}
})();
</script>
